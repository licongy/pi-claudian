name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill in the details below.
  - type: input
    id: package
    attributes:
      label: Package
      description: Which package is affected? (e.g. @pi-claudian/sync-title)
      placeholder: "@pi-claudian/sync-title"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: pi version
      description: Run `pi --version`
      placeholder: "0.82.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / environment
      placeholder: "macOS 15, Node 22.23.1"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps. Include any relevant config, logs, or errors.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
